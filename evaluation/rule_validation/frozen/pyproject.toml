[project]
name = "speakwell"
version = "0.1.0"
description = "SpeakWell local English tutor — recorded voice and text with SQLite memory"
readme = "README.md"
requires-python = ">=3.12.13,<3.13"
dependencies = [
    "faster-whisper>=1.2.1,<1.3",
    "httpx>=0.28.1,<0.29",
    "numpy>=2,<3",
    "ollama>=0.6.2",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.uv]
package = false
cache-dir = ".cache/uv"
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.ruff]
target-version = "py312"
